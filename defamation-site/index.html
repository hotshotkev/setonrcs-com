<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2e9">
    <meta name="description" content="A personal apology to Kevin Walters.">
    <title>A Personal Apology</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f2e9;
        --ink: #20372d;
        --ink-soft: #59685d;
      }

      * { box-sizing: border-box; }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        padding: 18px 24px;
        text-align: right;
      }

      .brand img {
        display: block;
        width: min(230px, 62vw);
        height: auto;
        aspect-ratio: 1124 / 632;
        object-fit: contain;
      }

      .brand-name { font-size: clamp(22px, 3vw, 30px); font-weight: 700; }
      .brand-note { color: var(--ink-soft); font-size: 10px; }

      main {
        display: grid;
        flex: 1;
        width: 100%;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .apology {
        margin: 0;
        font: 700 clamp(38px, 7vw, 68px)/1.1 Georgia, "Times New Roman", serif;
        letter-spacing: -.04em;
      }

      @media (max-width: 600px) {
        .brand { padding-inline: 16px; }
        main { padding: 24px 18px; }
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <img src="https://setonrcs.com/assets/arch-ai-datacenters.png" alt="">
      <span class="brand-name">Arch AI DataCenters</span>
      <span class="brand-note">Website design and implementation support</span>
    </header>
    <main>
      <h1 class="apology">I'm sorry to Kevin Walters.</h1>
    </main>
  </body>
</html>
